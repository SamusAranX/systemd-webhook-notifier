[package]
name = "notifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"

[[bin]]
name = "notifier"
path = "src/main.rs"

[profile.release]
debug = "line-tables-only"

[dependencies]
const_format = "0.2.34"
serde = { version = "1.0.219", features = ["derive"] }
clap = { version = "4.5.36", features = ["derive", "env"] }
anyhow = "1.0.98"
shell-words = "1.1.0"

[build-dependencies]
chrono = "0.4.40"
