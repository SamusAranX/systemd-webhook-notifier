[package]
name = "notifier"
version = "0.2.2"
edition = "2024"
rust-version = "1.93"

[[bin]]
name = "notifier"
path = "src/main.rs"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only"
lto = "thin"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
const_format = "0.2"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
shell-words = "1.1"
humansize = "2.1"
reqwest = { version = "0.13", features = ["blocking", "multipart"] }
serde_json = "1.0"
clap-num = "1.2"
nix = { version = "0.31", features = ["user"] }
regex = "1.12"
once_cell = "1.21"

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
