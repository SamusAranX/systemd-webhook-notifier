[package]
name = "notifier"
version = "0.2.0"
edition = "2024"
rust-version = "1.86"

[[bin]]
name = "notifier"
path = "src/main.rs"

[profile.release]
debug = "line-tables-only"

[dependencies]
chrono = "0.4.40"
const_format = "0.2.34"
serde = { version = "1.0.219", features = ["derive"] }
clap = { version = "4.5.37", features = ["derive", "env"] }
anyhow = "1.0.98"
shell-words = "1.1.0"
humansize = "2.1.3"
reqwest = { version = "0.12.15", features = ["blocking", "multipart"] }
serde_json = "1.0.140"
clap-num = "1.2.0"
nix = { version = "0.29.0", features = ["user"] }

[build-dependencies]
chrono = "0.4.40"
